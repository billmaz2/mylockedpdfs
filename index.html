<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Folder Gateway — Code 1234</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, Arial, sans-serif; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(145deg, #0e1a2b, #1b2c42);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #e2edff;
  }
  .card {
    background: #162232ee;
    border: 1px solid #2e4a6b;
    border-radius: 24px;
    padding: 32px 28px;
    max-width: 640px;
    width: 100%;
    box-shadow: 0 30px 50px rgba(0,0,0,0.7);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 26px;
    color: #e7f0ff;
  }
  .subtitle {
    color: #9bb5d4;
    margin-bottom: 24px;
    font-size: 14px;
    border-left: 3px solid #2d6db5;
    padding-left: 12px;
  }
  label {
    display: block;
    color: #b6cde9;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  input {
    flex: 1 1 200px;
    background: #0b141f;
    border: 1px solid #2a405c;
    border-radius: 40px;
    padding: 14px 20px;
    font-size: 16px;
    color: #e2edff;
    outline: none;
  }
  input:focus {
    border-color: #3f8eff;
    box-shadow: 0 0 0 3px #1f6feb44;
  }
  button {
    background: #1f6feb;
    border: 1px solid #5a9aff;
    border-radius: 40px;
    padding: 14px 28px;
    font-weight: 600;
    font-size: 16px;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: #2d7ef7; }
  button:active { transform: scale(0.98); }
  #errorBox {
    display: none;
    margin-top: 12px;
    padding: 10px 16px;
    background: #4d1f1faa;
    border-left: 5px solid #ff5e5e;
    border-radius: 12px;
    color: #ffa6a6;
    font-size: 14px;
  }
  #fileSection {
    display: none;
    margin-top: 24px;
    border-top: 1px dashed #2d4a6e;
    padding-top: 20px;
  }
  #fileSection h2 {
    font-size: 18px;
    font-weight: 500;
    color: #c3d9f5;
    margin: 0 0 14px;
  }
  .file-item {
    display: block;
    background: #101e2e;
    border: 1px solid #1f3750;
    border-radius: 12px;
    padding: 12px 18px;
    margin-bottom: 8px;
    text-decoration: none;
    color: #d2e3ff;
    font-size: 15px;
    word-break: break-all;
    transition: 0.15s;
  }
  .file-item:hover {
    background: #1c2f45;
    border-color: #3b77c0;
    transform: translateX(4px);
  }
  .file-item .badge {
    float: right;
    font-size: 11px;
    background: #1d3147;
    border: 1px solid #314e70;
    color: #7196bb;
    padding: 2px 10px;
    border-radius: 30px;
    margin-left: 10px;
  }
  #resetBtn {
    display: none;
    margin-top: 18px;
    background: none;
    border: none;
    color: #4d7eb3;
    text-decoration: underline;
    font-size: 13px;
    padding: 0;
    cursor: pointer;
    width: auto;
  }
  #debug {
    display: none;
    margin-top: 20px;
    padding: 10px;
    background: #000;
    color: #0f0;
    font-family: monospace;
    font-size: 12px;
    border-radius: 8px;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🔐 Folder Gateway</h1>
  <div class="subtitle">Enter code <strong>1234</strong> to see all files.</div>

  <!-- LOGIN SECTION -->
  <div id="loginSection">
    <label for="accessCode">Access Code</label>
    <div class="row">
      <input type="text" id="accessCode" placeholder="Type 1234 here" autocomplete="off">
      <button id="okBtn" type="button">🔓 OK</button>
    </div>
    <div id="errorBox">❌ Wrong code. Try again.</div>
  </div>

  <!-- FILE LIST SECTION -->
  <div id="fileSection">
    <h2>📁 Files in this folder (<span id="fileCount">0</span>)</h2>
    <div id="fileList"></div>
  </div>

  <button id="resetBtn" type="button">↻ Use another code</button>

  <!-- DEBUG OUTPUT (visible for troubleshooting) -->
  <div id="debug"></div>
</div>

<script>
// ============================================================
// CONFIGURATION — change these 2 lines only
// ============================================================

var SECRET_CODE = "1234";

// ⚠️ REPLACE with your real GitHub folder URL (must end with /)
// Example: "https://github.com/alice/myproject/raw/main/files/"
var GITHUB_FOLDER_BASE = "https://github.com/yourusername/yourrepo/raw/main/yourfolder/";

// ⚠️ REPLACE with the actual file names inside your GitHub folder
var FILE_NAMES = [
  "document.pdf",
  "image.png",
  "data.csv",
  "notes.txt",
  "readme.md"
];

// ============================================================
// SCRIPT LOGIC — do not edit below
// ============================================================

// Debug helper: shows messages on screen
function debug(msg) {
  var box = document.getElementById('debug');
  box.style.display = 'block';
  box.textContent += '> ' + msg + '\n';
}

debug('Script loaded. Code = ' + SECRET_CODE);
debug('Folder URL = ' + GITHUB_FOLDER_BASE);
debug('Files = ' + FILE_NAMES.length + ' items');

// Grab elements
var input     = document.getElementById('accessCode');
var okBtn     = document.getElementById('okBtn');
var errorBox  = document.getElementById('errorBox');
var loginSec  = document.getElementById('loginSection');
var fileSec   = document.getElementById('fileSection');
var fileList  = document.getElementById('fileList');
var fileCount = document.getElementById('fileCount');
var resetBtn  = document.getElementById('resetBtn');

// Focus input on load
setTimeout(function () { input.focus(); }, 100);

// Unlock function
function unlock() {
  debug('unlock() called');

  // Hide login, show file list
  loginSec.style.display = 'none';
  errorBox.style.display = 'none';
  fileSec.style.display = 'block';
  resetBtn.style.display = 'inline-block';

  // Build links
  fileList.innerHTML = '';

  var base = GITHUB_FOLDER_BASE;
  if (base.charAt(base.length - 1) !== '/') {
    base = base + '/';
  }

  for (var i = 0; i < FILE_NAMES.length; i++) {
    var name = FILE_NAMES[i];
    var url  = base + encodeURIComponent(name);

    var a = document.createElement('a');
    a.className = 'file-item';
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.innerHTML = '📄 ' + name + '<span class="badge">open</span>';

    fileList.appendChild(a);
  }

  fileCount.textContent = FILE_NAMES.length;
  debug('Rendered ' + FILE_NAMES.length + ' file links');
}

// Check code
function checkCode() {
  var typed = input.value;
  debug('Typed: "' + typed + '" | Expected: "' + SECRET_CODE + '"');

  // Compare (trim only whitespace at ends — do NOT lowercase)
  if (typed.trim() === SECRET_CODE) {
    debug('✅ Code matched!');
    unlock();
  } else {
    debug('❌ Code did NOT match');
    errorBox.style.display = 'block';
    input.focus();
    input.select();
  }
}

// Reset
function reset() {
  debug('reset() called');
  loginSec.style.display = 'block';
  fileSec.style.display = 'none';
  resetBtn.style.display = 'none';
  errorBox.style.display = 'none';
  fileList.innerHTML = '';
  input.value = '';
  input.focus();
}

// Attach events
okBtn.addEventListener('click', function (e) {
  e.preventDefault();
  checkCode();
});

input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' || e.keyCode === 13) {
    e.preventDefault();
    checkCode();
  }
});

resetBtn.addEventListener('click', function (e) {
  e.preventDefault();
  reset();
});

debug('Events attached. Ready.');
</script>

</body>
</html>
